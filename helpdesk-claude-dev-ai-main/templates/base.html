<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResolveDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fa; }
        #sidebar {
            background-color: #4F46E5;
            min-height: 100vh;
            width: 220px;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        #sidebar .sidebar-brand {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 24px 20px 20px 20px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 8px;
        }
        #sidebar .nav-link {
            color: rgba(255,255,255,0.85);
            padding: 10px 20px;
            border-radius: 6px;
            margin: 2px 10px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }
        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
        #sidebar .nav-link i { width: 18px; text-align: center; }
        #main-content {
            margin-left: 220px;
            padding: 32px 36px;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <nav id="sidebar">
        <div class="sidebar-brand">⚡ ResolveDesk</div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('dashboard') }}">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('tickets') }}">
                    <i class="fas fa-ticket-alt"></i> Tickets
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('create_ticket') }}">
                    <i class="fas fa-plus-circle"></i> Create Ticket
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('analytics') }}">
                    <i class="fas fa-chart-bar"></i> Analytics
                </a>
            </li>
        </ul>
    </nav>

    <div id="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-4" role="alert" id="flash-message">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

    <script>
        $(document).ready(function() {
            setTimeout(function() {
                $('#flash-message').fadeOut('slow');
            }, 5000);
        });
    </script>
</body>
</html>
